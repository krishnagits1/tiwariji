<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>पोस्टर बनाएँ — आचार्य पंडित विक्रम तिवारी जी</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    body{font-family:'Noto Sans Devanagari',sans-serif;background:#fff6e8;color:#4b342f;margin:0;padding:20px;}
    header{text-align:center;background:linear-gradient(90deg,#b45309,#d97706);color:white;padding:20px;border-radius:10px;}
    h1{margin:0;font-size:22px;}
    .card{background:white;padding:20px;border-radius:10px;box-shadow:0 6px 14px rgba(0,0,0,0.2);max-width:800px;margin:20px auto;}
    label{font-weight:600;display:block;margin-top:10px;}
    input,textarea{width:100%;padding:8px;margin-top:6px;border-radius:8px;border:1px solid #ccc;}
    .preview{margin-top:20px;text-align:center;}
    .poster-frame{width:500px;height:auto;background:white;border:10px solid #d97706;padding:16px;margin:auto;border-radius:10px;}
    button{background:#b45309;color:#fff;padding:10px 16px;border:none;border-radius:8px;cursor:pointer;margin-top:10px;font-weight:600;}
    button:hover{background:#d97706;}
    .btn-row{text-align:center;margin-top:20px;}
    main{padding:40px 20px;}
    .btn{
      display:inline-block;
      background:#b45309;
      color:#fff;
      font-weight:600;
      padding:12px 22px;
      margin:10px;
      border-radius:8px;
      text-decoration:none;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
      transition:0.3s;
    }
  </style>
</head>
<body>
  <header>
    <h1>🪔 त्योहार / विशेष अवसर पोस्टर बनाएँ</h1>
  </header>

  <div class="card">
    <label>त्योहार या अवसर का नाम</label>
    <input id="festivalName" placeholder="जैसे – दीपावली, नवरात्रि, रक्षाबंधन...">

    <label>देवी / देवता का नाम</label>
    <input id="deityName" placeholder="जैसे – लक्ष्मी माता, गणेश जी...">

    <label>शुभकामना संदेश / श्लोक</label>
    <textarea id="message" rows="3" placeholder="यहाँ अपना श्लोक या शुभकामना लिखें..."></textarea>

    <label>देवी/देवता की फोटो अपलोड करें</label>
    <input type="file" id="imageUpload" accept="image/*">

    <div class="btn-row">
      <button onclick="generatePoster()">पूर्वावलोकन देखें</button>
      <button onclick="downloadPoster()">📥 पोस्टर डाउनलोड करें</button>
      <button onclick="shareWhatsApp()">📱 WhatsApp पर भेजें</button>
    </div>

    <div class="preview">
      <div id="posterPreview" class="poster-frame">
        <h2 id="posterTitle">🎉 आपका पोस्टर यहाँ दिखेगा 🎉</h2>
      </div>
    </div>
  </div>
  <main>
 <a href="index.html" class="btn"> होम पेज पर जाए </a>
 </main>
  <script>
    let imageData = null;

    document.getElementById('imageUpload').addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => imageData = ev.target.result;
      reader.readAsDataURL(file);
    });

    function generatePoster(){
      const name = document.getElementById('festivalName').value;
      const deity = document.getElementById('deityName').value;
      const msg = document.getElementById('message').value;
      const preview = document.getElementById('posterPreview');
      preview.innerHTML = `
        <div style="text-align:center;">
          ${imageData ? `<img src="${imageData}" style="width:150px;height:150px;border-radius:10px;border:4px solid #fbbf24;">` : ""}
          <h2 style="color:#b45309;margin-top:10px;">${name || "त्योहार विशेष"}</h2>
          <h3 style="margin:5px 0;">${deity || ""}</h3>
          <p style="background:#fff4e0;padding:10px;border-radius:8px;">${msg || "यहाँ श्लोक / शुभकामना लिखी जाएगी।"}</p>
          <p style="font-size:12px;margin-top:8px;color:#5b3a05;">– आचार्य पंडित विक्रम तिवारी, पटना, बड़हलगंज, गोरखपुर, उत्तर प्रदेश</p>
           <p style="font-size:12px;margin-top:8px;color:#5b3a05;">– संपर्क करें  :  +91 9415928664, 7081515744</p>
        </div>`;
    }

    async function downloadPoster(){
      const el = document.getElementById('posterPreview');
      const canvas = await html2canvas(el,{scale:2});
      const link = document.createElement('a');
      link.download = 'poster.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    function shareWhatsApp(){
      const msg = encodeURIComponent("🪔 पंडित विक्रम तिवारी जी द्वारा तैयार पूजा / त्यौहार पोस्टर देखें 🙏");
      window.open(`https://wa.me/?text=${msg}`,'_blank');
    }
  </script>
</body>
</html>
